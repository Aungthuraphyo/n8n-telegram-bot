services:
  - type: web
    name: n8n-telegram-bot
    env: docker
    plan: starter
    docker:
      dockerfile: ./Dockerfile
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: true
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        value: my_secure_password_123
      - key: N8N_PROTOCOL
        value: https
    healthCheckPath: /healthz
