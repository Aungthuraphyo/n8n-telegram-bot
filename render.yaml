services:
  - type: web
    name: n8n-test
    env: docker
    plan: starter
    docker:
      dockerfile: ./Dockerfile
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: true
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        value: testpassword123
      - key: N8N_ENCRYPTION_KEY
        value: test-32-char-encryption-key-12345
      - key: N8N_PROTOCOL
        value: https
