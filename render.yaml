services:
  - type: web
    name: n8n-production
    env: docker
    plan: starter
    docker:
      dockerfile: ./Dockerfile
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: true
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        value: my_secure_password_123
      - key: N8N_ENCRYPTION_KEY
        value: my-32-character-encryption-key-1234
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        value: https://n8n-production.onrender.com
    healthCheckPath: /healthz
