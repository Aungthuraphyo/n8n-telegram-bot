services:
  - type: web
    name: n8n-telegram-bot
    env: docker
    plan: free
    docker:
      dockerfile: ./Dockerfile
    envVars:
      - key: N8N_BASIC_AUTH_ACTIVE
        value: true
      - key: N8N_BASIC_AUTH_USER
        value: admin
      - key: N8N_BASIC_AUTH_PASSWORD
        value: your_strong_password_here
      - key: N8N_PROTOCOL
        value: https
      - key: WEBHOOK_URL
        value: https://your-n8n-app.onrender.com
    healthCheckPath: /healthz